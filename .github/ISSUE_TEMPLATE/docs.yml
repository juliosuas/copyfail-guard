name: Documentation improvement
description: Report unclear, missing, or risky documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page or section
      placeholder: README.md, docs/fleet-rollout.md, etc.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What should change?
      description: Explain what was confusing, missing, or unsafe.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
